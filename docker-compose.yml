version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diensabyansah-postgres
    environment:
      POSTGRES_USER: diensabyansah
      POSTGRES_PASSWORD: dev-password-change-in-prod
      POSTGRES_DB: diensabyansah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diensabyansah"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
